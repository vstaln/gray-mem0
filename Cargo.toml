[package]
name = "gray-mem0"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "mem0 semantic memory plugin for the gray agent harness"
license = "MIT"
[lib]
name = "mem0_plugin"
path = "src/lib.rs"
[[bin]]
name = "mem0"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
